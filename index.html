<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRISIS — INDIA: Mysore and Chennai accommodation contacts and stay details.">
  <meta name="theme-color" content="#f5f2eb">
  <title>CRISIS — INDIA</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a92f24'/%3E%3Cpath d='M16 7v12m0 5v1' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink: #24241f; --muted: #65645b; --accent: #a92f24; --line: #d6d2c7; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f2eb; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
    main { width: min(100% - 40px, 960px); margin: 0 auto; padding: 64px 0; }
    header { padding-bottom: 32px; border-bottom: 2px solid var(--ink); margin-bottom: 32px; }
    h1 { font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.15; margin: 0; }
    h1 span { color: var(--accent); }
    .contacts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    article { border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 28px; background: #fffdf7; }
    h2 { font-size: 1.5rem; letter-spacing: .04em; margin: 0 0 24px; }
    p { margin: 0 0 8px; font-size: 1rem; }
    .label { color: var(--muted); }
    .phone { display: inline-block; color: var(--accent); font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 650; text-decoration-thickness: 1px; text-underline-offset: 5px; padding: 6px 0; overflow-wrap: anywhere; }
    .details { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
    h3 { color: var(--muted); font-size: 1rem; font-weight: 500; margin: 0 0 8px; }
    address { font-style: normal; font-size: 1.125rem; }
    .stay { margin-top: 24px; }
    .dates { font-size: 1.5rem; font-weight: 650; margin: 0; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    @media (max-width: 640px) { main { padding: 32px 0; } header { margin-bottom: 24px; padding-bottom: 24px; } .contacts { grid-template-columns: 1fr; gap: 20px; } article { padding: 24px; } }
    @media print { body { background: white; } main { width: 100%; padding: 0; } article { break-inside: avoid; } .phone { color: var(--ink); text-decoration: none; } }
  </style>
</head>
<body>
  <main>
    <header><h1>CRISIS <span>— INDIA</span></h1></header>
    <div class="contacts">
      <article aria-labelledby="mysore">
        <h2 id="mysore">MYSORE</h2>
        <p class="label">Airbnb / WhatsApp</p>
        <a class="phone" href="tel:+916362045066">+91 63620 45066</a>
      </article>
      <article aria-labelledby="chennai">
        <h2 id="chennai">CHENNAI</h2>
        <p class="label">Airbnb host: Sumita</p>
        <a class="phone" href="tel:+919884024662">+91 98840 24662</a>
        <div class="details">
          <h3>Address:</h3>
          <address>2nd Cross St<br>Chennai, Tamil Nadu 600004<br>India</address>
          <div class="stay">
            <h3>Stay:</h3>
            <p class="dates">8 Oct → 11 Oct</p>
          </div>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
